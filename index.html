<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>紅酒香料包 | Nosif Pastry</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 連到同一資料夾裡的 style.css -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <h1 class="logo">紅酒香料包</h1>
    <p class="subtitle">冬日暖心小酒・在家也能做的法式儀式感</p>
  </header>

  <main class="container">
    <section class="product-card">
      <h2>Nosif 法式紅酒香料包</h2>
      <p class="tagline">一包搭配一瓶紅酒，約 2～3 人份</p>

      <ul class="spec-list">
        <li>成分：糖漬橙片、肉桂棒、八角、丁香、肉豆蔻、綠豆蔻</li>
        <li>建議使用：偏乾紅葡萄酒 750 ml</li>
        <li>適合場合：聖誕派對、跨年、冬天小聚會</li>
      </ul>

      <a href="#" class="btn-primary">預約購買</a>
    </section>

    <section class="how-to">
      <h3>簡易沖煮方式</h3>
      <ol>
        <li>將紅酒倒入小鍋，以小火加熱（不要煮滾）。</li>
        <li>加入一包紅酒香料包，慢慢加熱約 10～15 分鐘。</li>
        <li>依個人口味可再加少許糖或蜂蜜，過濾後即可享用。</li>
      </ol>
    </section>
  </main>

  <footer class="site-footer">
    <p>Nosif 法國廚師的甜點 · 手作小量生產 · 暖心過冬</p>
  </footer>
</body>
</ht
